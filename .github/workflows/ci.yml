name: ci
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            **/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.config', 'nuget.config', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore & Build (.sln or .csproj)
        shell: pwsh
        run: |
          Write-Host "=== Scan repo for .sln / .csproj ==="
          $solutions = Get-ChildItem -Recurse -Filter *.sln | Select-Object -Expand FullName
          $projects  = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -Expand FullName
          Write-Host "Found solutions:`n$($solutions -join "`n")"
          Write-Host "Found projects :`n$($projects -join "`n")"
              # restore kiểu packages.config
          nuget restore FoodOrderingSystem.sln
      
          # restore kiểu PackageReference (nếu có)
          msbuild FoodOrderingSystem.sln -t:Restore
      
          # build
          msbuild FoodOrderingSystem.sln /p:Configuration=Debug /m

          if ($solutions) {
            foreach ($sln in $solutions) {
              nuget restore "$sln"
              msbuild "$sln" /p:Configuration=Release /m
            }
            exit 0
          }

          if ($projects) {
            foreach ($csproj in $projects) {
              nuget restore "$csproj"
              msbuild "$csproj" /p:Configuration=Release /m
            }
            exit 0
          }

          Write-Error "No .sln or .csproj found in repository."
          exit 1
  
  unit_tests:
    needs: build
    runs-on: windows-latest
    env:
      COV_MIN: 18
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
  
      - name: Build tests (Debug with PDB)
        shell: pwsh
        run: |
          # 1) Restore cho các project kiểu packages.config trong .sln
          nuget restore FoodOrderingSystem.sln
      
          # 2) Restore chuẩn cho các project dùng PackageReference TRONG .sln (nếu có)
          msbuild FoodOrderingSystem.sln -t:Restore
      
          # 3) ***Restore RIÊNG cho project test*** (vì dùng PackageReference / có thể không nằm trong .sln)
          msbuild ".\FoodOrderingSystem.Tests\FoodOrderingSystem.Tests.csproj" -t:Restore
      
          # 4) Build solution Debug + PDB full
          msbuild FoodOrderingSystem.sln `
            /p:Configuration=Debug `
            /p:DebugSymbols=true `
            /p:DebugType=Full `
            /m
      
          # 5) Build riêng project test để chắc chắn sinh DLL + PDB
          msbuild ".\FoodOrderingSystem.Tests\FoodOrderingSystem.Tests.csproj" `
            /p:Configuration=Debug `
            /p:DebugSymbols=true `
            /p:DebugType=Full `
            /m
      
          # 6) In ra PDB để kiểm tra
          Get-ChildItem -Recurse ".\FoodOrderingSystem.Tests\bin\Debug" -Filter *.pdb | Select-Object FullName

  
          # Tìm VSTest (Robust)
          $vsPath = vswhere -latest -products * -requires Microsoft.VisualStudio.Component.TestTools.Core -property installationPath
          if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
          $vstest = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          
          if (-not (Test-Path $vstest)) { 
            Write-Host "VSTest not found at $vstest. Searching recursively..."
            $vstest = Get-ChildItem -Path $vsPath -Filter "vstest.console.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $vstest) { throw "Critical: vstest.console.exe not found!" }
          Write-Host "Using VSTest: $vstest"

          # Cài đặt Adapter thủ công để chắc chắn có
          nuget install MSTest.TestAdapter -Version 3.3.1 -OutputDirectory test-adapters

          # Đường dẫn DLL
          $testDll = ".\FoodOrderingSystem.Tests\bin\Debug\net48\FoodOrderingSystem.Tests.dll"

          # Chạy VSTest với Adapter Path trỏ vào thư mục vừa cài + x64
          & $vstest $testDll `
            /Logger:trx `
            /ResultsDirectory:"out\unit-results" `
            /TestAdapterPath:"test-adapters" `
            /Platform:x64


      - name: Enforce coverage threshold
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $min = [double](${env:COV_MIN} ?? 60)
          $cob = Join-Path $PWD "unit-coveragereport\Cobertura.xml"
          if (-not (Test-Path $cob)) { throw "Coverage file not found: $cob" }
          [xml]$x = Get-Content $cob
          $pct = [math]::Round([double]$x.coverage.'line-rate' * 100, 2)
          Write-Host "Line coverage: $pct % (min: $min %)"
          if ($pct -lt $min) { throw "Coverage below threshold ($min%). Current: $pct%" }

  
      - name: Upload unit results & coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-and-coverage
          path: |
            out/unit-results/*.trx
            unit-coverage.xml
            unit-coveragereport/**
    
      - name: Summarize UNIT tests (to job summary)
        if: always()
        shell: pwsh
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          $trxDir      = "out/unit-results"

          if (-not (Test-Path $trxDir)) {
            "## Unit tests"              | Out-File $summaryFile -Encoding utf8
            ""                           | Out-File $summaryFile -Encoding utf8 -Append
            "Không tìm thấy thư mục '$trxDir'." | Out-File $summaryFile -Encoding utf8 -Append
            exit 0
          }

          $trxFiles = Get-ChildItem -Path $trxDir -Filter *.trx -Recurse
          if (-not $trxFiles) {
            "## Unit tests"                            | Out-File $summaryFile -Encoding utf8
            ""                                         | Out-File $summaryFile -Encoding utf8 -Append
            "Không tìm thấy file .trx trong '$trxDir'." | Out-File $summaryFile -Encoding utf8 -Append
            exit 0
          }

          $total   = 0
          $passed  = 0
          $failed  = 0
          $skipped = 0
          $failedNames = @()

          foreach ($file in $trxFiles) {
            # DEBUG: In ra thông tin file
            Write-Host "Processing file: $($file.FullName)"
            [xml]$xml = Get-Content $file.FullName
            
            # DEBUG: In ra root element và namespace
            Write-Host "Root Element: $($xml.DocumentElement.Name)"
            Write-Host "NamespaceURI: $($xml.DocumentElement.NamespaceURI)"

            # Dùng XPath local-name() để không phụ thuộc namespace
            $results = $xml.SelectNodes("//*[local-name()='UnitTestResult']")
            
            # DEBUG: In ra số lượng kết quả tìm thấy
            Write-Host "Found $($results.Count) UnitTestResult nodes."
            foreach ($r in $results) {
              $total++
              switch ($r.outcome) {
                "Passed"      { $passed++ }
                "Failed"      { $failed++;  $failedNames += $r.testName }
                "NotExecuted" { $skipped++ }
              }
            }
          }

          "## Unit tests"                               | Out-File $summaryFile -Encoding utf8
          ""                                            | Out-File $summaryFile -Encoding utf8 -Append
          "| Total | Passed | Failed | Skipped |"       | Out-File $summaryFile -Encoding utf8 -Append
          "|------:|-------:|-------:|--------:|"       | Out-File $summaryFile -Encoding utf8 -Append
          "| $total | $passed | $failed | $skipped |"   | Out-File $summaryFile -Encoding utf8 -Append
          ""                                            | Out-File $summaryFile -Encoding utf8 -Append

          if ($failed -gt 0) {
            "### Failed unit tests"                    | Out-File $summaryFile -Encoding utf8 -Append
            foreach ($name in $failedNames) {
              "* $name"                                | Out-File $summaryFile -Encoding utf8 -Append
            }
          }
          else {
            "✅ Tất cả unit tests đều PASS."            | Out-File $summaryFile -Encoding utf8 -Append
          }



  integration_tests:
    if: github.event_name == 'push'   # chỉ chạy khi push/merge vào main
    needs: build
    runs-on: windows-latest
  
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4        # để dùng lệnh dotnet (SDK)
        with:
          dotnet-version: '9.x'
      - uses: nuget/setup-nuget@v2
  
      - name: Build (Release) for integration tests
        shell: pwsh
        run: |
          # Restore cho solution kiểu packages.config (nếu có)
          nuget restore
          msbuild FoodOrderingSystem.sln -t:Restore
  
          # 👉 Restore RIÊNG cho project test (SDK-style)
          dotnet restore .\FoodOrderingSystem.Tests\FoodOrderingSystem.Tests.csproj
  
          # Build solution Release
          msbuild FoodOrderingSystem.sln /p:Configuration=Release /m
  
          # Build riêng project test để chắc chắn có DLL
          msbuild .\FoodOrderingSystem.Tests\FoodOrderingSystem.Tests.csproj /p:Configuration=Release /m

  
      # 2) SQL LocalDB + seed schema
      - name: Prepare SQL LocalDB and seed schema
        shell: pwsh
        run: |
          sqllocaldb start "MSSQLLocalDB" | Out-Null
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "IF DB_ID('OnlineFoodDB') IS NULL CREATE DATABASE [OnlineFoodDB]"
          sqlcmd -S "(localdb)\MSSQLLocalDB" -d "OnlineFoodDB" -i "onlinefoodscript.sql"
  
      - name: Run INTEGRATION tests (dotnet test)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'out\integration-results'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Tìm VSTest (Robust)
          $vsPath = vswhere -latest -products * -requires Microsoft.VisualStudio.Component.TestTools.Core -property installationPath
          if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
          $vstest = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          
          if (-not (Test-Path $vstest)) { 
             $vstest = Get-ChildItem -Path $vsPath -Filter "vstest.console.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $vstest) { throw "Critical: vstest.console.exe not found!" }

          nuget install MSTest.TestAdapter -Version 3.3.1 -OutputDirectory test-adapters

          $testDll = ".\FoodOrderingSystem.Tests\bin\Release\net48\FoodOrderingSystem.Tests.dll"
          
          & $vstest $testDll `
            /Logger:trx `
            /ResultsDirectory:$out `
            /TestAdapterPath:"test-adapters" `
            /TestCaseFilter:"TestCategory=Integration" `
            /Platform:x64


  
      - name: Upload integration results
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: out/integration-results/*.trx


      - name: Summarize INTEGRATION tests (to job summary)
        if: always()
        shell: pwsh
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          $trxDir      = "out/integration-results"

          if (-not (Test-Path $trxDir)) {
            "## Integration tests"                    | Out-File $summaryFile -Encoding utf8
            ""                                        | Out-File $summaryFile -Encoding utf8 -Append
            "Không tìm thấy thư mục '$trxDir'."       | Out-File $summaryFile -Encoding utf8 -Append
            exit 0
          }

          $trxFiles = Get-ChildItem -Path $trxDir -Filter *.trx -Recurse
          if (-not $trxFiles) {
            "## Integration tests"                            | Out-File $summaryFile -Encoding utf8
            ""                                                | Out-File $summaryFile -Encoding utf8 -Append
            "Không tìm thấy file .trx trong '$trxDir'."       | Out-File $summaryFile -Encoding utf8 -Append
            exit 0
          }

          $total   = 0
          $passed  = 0
          $failed  = 0
          $skipped = 0
          $failedNames = @()

          foreach ($file in $trxFiles) {
            [xml]$xml = Get-Content $file.FullName

            # Dùng XPath local-name() để không phụ thuộc namespace
            $results = $xml.SelectNodes("//*[local-name()='UnitTestResult']")
            foreach ($r in $results) {
              $total++
              switch ($r.outcome) {
                "Passed"      { $passed++ }
                "Failed"      { $failed++;  $failedNames += $r.testName }
                "NotExecuted" { $skipped++ }
              }
            }
          }

          "## Integration tests"                          | Out-File $summaryFile -Encoding utf8
          ""                                              | Out-File $summaryFile -Encoding utf8 -Append
          "| Total | Passed | Failed | Skipped |"         | Out-File $summaryFile -Encoding utf8 -Append
          "|------:|-------:|-------:|--------:|"         | Out-File $summaryFile -Encoding utf8 -Append
          "| $total | $passed | $failed | $skipped |"     | Out-File $summaryFile -Encoding utf8 -Append
          ""                                              | Out-File $summaryFile -Encoding utf8 -Append

          if ($failed -gt 0) {
            "### Failed integration tests"               | Out-File $summaryFile -Encoding utf8 -Append
            foreach ($name in $failedNames) {
              "* $name"                                  | Out-File $summaryFile -Encoding utf8 -Append
            }
          }
          else {
            "✅ Tất cả integration tests đều PASS."       | Out-File $summaryFile -Encoding utf8 -Append
          }




  package:
    needs: [unit_tests]         # chỉ package khi unit pass; muốn chỉ khi push thì thêm điều kiện if
    runs-on: windows-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet (packages.config)
        shell: pwsh
        run: |
          nuget restore .\FoodOrderingSystem.sln -NonInteractive
          # đảm bảo gói CodeDom có mặt (phòng khi nuget restore bỏ sót)
          if (-not (Test-Path ".\packages\Microsoft.CodeDom.Providers.DotNetCompilerPlatform.2.0.0\build\net46\Microsoft.CodeDom.Providers.DotNetCompilerPlatform.props")) {
            nuget install Microsoft.CodeDom.Providers.DotNetCompilerPlatform -Version 2.0.0 -OutputDirectory packages
          }
      - name: Package Web App (WebDeploy zip)
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter FoodOrderingSystem.csproj | Select-Object -First 1 -Expand FullName
          if (-not $proj) { throw "Không tìm thấy FoodOrderingSystem.csproj" }
          msbuild $proj `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=Package `
            /p:PackageAsSingleFile=true `
            /p:PackageLocation="$PWD\out\FoodOrderingSystem.zip"
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdeploy-package
          path: out/FoodOrderingSystem.zip
